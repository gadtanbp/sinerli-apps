<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
(function (d) {
    try {
        var pref = localStorage.getItem('sinerli_lite') || 'auto';
        var n = navigator, c = n.connection || n.mozConnection || n.webkitConnection || {};
        var mem = n.deviceMemory, cores = n.hardwareConcurrency;
        var weak = (mem && mem <= 2) || (mem && cores && cores <= 2) || c.saveData === true ||
            c.effectiveType === '2g' || c.effectiveType === 'slow-2g';
        if (pref === 'on' || (pref !== 'off' && weak)) {
            d.documentElement.className += ' sinerli-lite low-end-device';
            d.addEventListener('DOMContentLoaded', function () {
                d.body.classList.add('sinerli-lite', 'low-end-device');
            });
        }
        window.sinerliLite = { pref: pref, auto: !!weak };
    } catch (e) {}
})(document);
</script>

<body class="so-app ss-app">
    <div class="so-loading" id="soLoading">
        <div class="so-loading-logo has-img"><img src="assets/icon.png" alt="" width="66" height="66"></div>
        <div class="so-loading-name">Sinerli Present</div>
        <div class="so-loading-bar"></div>
    </div>

    <header id="soTitlebar"></header>
    <div id="ssRibbon"></div>

    <div class="ss-workspace" id="ssWorkspace">
        <aside class="ss-slidepanel" id="ssSlidePanel">
            <div class="ss-slidelist" id="ssSlideList" tabindex="0" role="listbox" data-lang-aria="s_slides"></div>
            <button type="button" class="ss-add-slide" id="ssAddSlide"><i class="fas fa-plus"></i><span data-lang="s_new_slide"></span></button>
        </aside>
        <main class="ss-main" id="ssMain">
            <div class="ss-canvas-wrap" id="ssCanvasWrap" tabindex="-1">
                <div class="ss-stage" id="ssStage">
                    <div class="ss-slide-host" id="ssSlideHost" spellcheck="true"></div>
                    <div class="ss-overlay" id="ssOverlay"></div>
                </div>
            </div>
            <div class="ss-notes-resize" id="ssNotesResize"></div>
            <div class="ss-notes" id="ssNotes">
                <textarea id="ssNotesText" data-lang-ph="s_notes_ph" data-lang-aria="s_notes"></textarea>
            </div>
            <div class="ss-sorter" id="ssSorter" tabindex="0" hidden></div>
        </main>
        <aside class="so-pane ss-pane" id="ssPane" hidden>
            <div class="so-pane-head">
                <h3 class="so-pane-title" id="ssPaneTitle"></h3>
                <button class="so-tb-btn ss-pane-close" type="button" id="ssPaneClose" data-lang-title="c_close"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="so-pane-body" id="ssPaneBody"></div>
        </aside>
    </div>

    <footer class="so-statusbar" id="ssStatus">
        <span class="so-sb-item" id="ssStSlide"></span>
        <span class="so-sb-item so-sb-hide-mobile" id="ssStTheme"></span>
        <span class="so-sb-item so-sb-hide-mobile" id="ssStSel"></span>
        <span class="so-sb-spacer"></span>
        <button class="so-sb-item" type="button" id="ssStNotes"><i class="fas fa-note-sticky"></i><span class="so-sb-hide-mobile" data-lang="s_notes"></span></button>
        <button class="so-sb-item so-sb-hide-mobile" type="button" id="ssStComments"><i class="fas fa-comment"></i><span data-lang="s_comments"></span></button>
        <div class="ss-views">
            <button type="button" class="ss-view-btn" data-view="normal" data-tip="s_view_normal"><i class="fas fa-display"></i></button>
            <button type="button" class="ss-view-btn" data-view="sorter" data-tip="s_view_sorter"><i class="fas fa-table-cells-large"></i></button>
            <button type="button" class="ss-view-btn so-sb-hide-mobile" data-view="reading" data-tip="s_view_reading"><i class="fas fa-book-open"></i></button>
            <button type="button" class="ss-view-btn" data-view="show" data-tip="s_slideshow"><i class="fas fa-person-chalkboard"></i></button>
        </div>
        <div class="so-zoom">
            <button type="button" id="ssZoomOut" data-lang-title="c_zoom_out"><i class="fas fa-minus"></i></button>
            <input type="range" id="ssZoomRange" min="10" max="400" step="5" value="100" data-lang-aria="c_zoom">
            <button type="button" id="ssZoomIn" data-lang-title="c_zoom_in"><i class="fas fa-plus"></i></button>
            <button type="button" class="so-zoom-val" id="ssZoomVal">100%</button>
            <button type="button" id="ssZoomFit" data-tip="s_fit_window"><i class="fas fa-expand"></i></button>
        </div>
    </footer>

    <div class="ss-print-root" id="ssPrintRoot"></div>

    <script type="text/sn-deferred" data-src="office/shared/office-i18n.js"></script>
    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-i18n.js"></script>
    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-i18n-2.js"></script>

    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-model.js"></script>
    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-render.js"></script>

    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-io.js"></script>
    <script type="text/sn-deferred" data-src="office/shared/office-ai.js"></script>
    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-ai.js"></script>
    <script type="text/sn-deferred" data-src="office/sineslide/sineslide-ribbon.js"></script>

</body>
</html>
